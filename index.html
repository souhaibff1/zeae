<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Rules — القوانين الكاملة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box}
:root{
  --bg:#08090d; --panel:#101219; --panel2:#151822; --text:#f4f4f6; --muted:#a2a5ad;
  --red:#ff2b2b; --red2:#a90f18; --line:#292d38; --glow:rgba(255,43,43,.28);
}
body{margin:0;background:
 radial-gradient(circle at 15% 0%,rgba(255,43,43,.14),transparent 28%),
 radial-gradient(circle at 85% 10%,rgba(255,43,43,.08),transparent 24%),
 linear-gradient(180deg,#0a0b0f,#06070a 70%);
 color:var(--text);font-family:'Cairo',system-ui,sans-serif;min-height:100vh}
.container{width:min(1240px,92%);margin:auto}
.hero{padding:52px 0 28px;text-align:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border:1px solid #3a2023;border-radius:999px;background:#120c0e;color:#ff6b6b;font-size:13px}
h1{font-size:clamp(42px,7vw,82px);line-height:1;margin:20px 0 12px;font-weight:900;letter-spacing:-2px}
h1 span{color:var(--red);text-shadow:0 0 30px var(--glow)}
.hero p{color:var(--muted);font-size:16px;margin:0 auto;max-width:720px}
.toolbar{position:sticky;top:14px;z-index:10;margin:24px 0 34px;padding:12px;background:rgba(10,11,15,.78);border:1px solid #242833;border-radius:18px;backdrop-filter:blur(14px);display:flex;gap:10px;align-items:center}
.search{flex:1;background:#0c0e13;border:1px solid #2b303c;color:white;padding:15px 17px;border-radius:12px;outline:none;font-family:inherit;font-size:15px}
.search:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,43,43,.10)}
.count{color:#b8bbc2;font-size:13px;white-space:nowrap;padding:0 8px}
.section{margin:0 0 34px}
.section-title{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:25px;font-weight:900}
.section-title:before{content:'';width:6px;height:30px;border-radius:10px;background:linear-gradient(180deg,var(--red),#7d1017);box-shadow:0 0 18px var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,#141720,#0e1016);border:1px solid var(--line);border-radius:18px;padding:19px;cursor:pointer;transition:.2s transform,.2s border-color,.2s box-shadow}
.card:after{content:'';position:absolute;inset:auto -30px -70px auto;width:110px;height:110px;background:radial-gradient(circle,rgba(255,43,43,.18),transparent 65%);pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:#5f2529;box-shadow:0 12px 35px rgba(0,0,0,.34)}
.code{font-size:24px;font-weight:900;color:#ff4e4e;letter-spacing:.5px}
.rule{margin-top:8px;font-size:17px;line-height:1.8;font-weight:700;color:#fff}
.hint{margin-top:11px;color:#787c86;font-size:12px}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#171a22;border:1px solid #463136;color:white;padding:13px 18px;border-radius:13px;box-shadow:0 15px 45px rgba(0,0,0,.45);transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{display:none;text-align:center;color:#777b85;padding:30px}
footer{padding:10px 0 50px;text-align:center;color:#666a73;font-size:13px}
@media(max-width:650px){.toolbar{top:8px}.count{display:none}.rule{font-size:16px}}
</style>
</head>
<body>
<div class="container">
  <header class="hero">
    <div class="badge">🔴 RP RULES • اضغط على أي قانون لنسخه</div>
    <h1>القوانين <span>الكاملة</span></h1>
    <p>صفحة تفاعلية مرتبة لقوانين الـRP. اضغط على أي بطاقة وسيتم نسخ نص القانون مباشرة إلى الحافظة.</p>
  </header>

  <div class="toolbar">
    <input id="search" class="search" placeholder="ابحث عن كود أو قانون..." />
    <div id="count" class="count"></div>
  </div>

  <main id="app"></main>
  <div id="empty" class="empty">لا يوجد قانون يطابق البحث.</div>

  <footer>اضغط على القانون لنسخ نصه فقط — مصمم بستايل داكن + أحمر مستوحى من صورة القوانين.</footer>
</div>
<div id="toast" class="toast">تم نسخ القانون ✅</div>

<script>
const DATA = [["الفئة الأساسية", [["A8", "تمنع الخروج أو الدخول تحت أي شكل"], ["Amon", "شالون التحرك داخل المناطق"], ["AA", "استخدام الادمن زنبته لمصلحته الشخصية"], ["AB", "التخريب"], ["APO", "قانون التصرف بواقعية بعد الموت"], ["AC", "قانون الشخصية في نفس الفاكشن"], ["ASKING", "قانون الامتثال"], ["BH", "في نفس الوقت"], ["Drown", "شالون إبي بزايد خطأ"], ["DP", "الأسلحة في اليد بدون RP"], ["CO", "تظاهر الشخصية"], ["CK", "قانون عدم الشخصية من قبل"], ["CR", "إطلاق النار"], ["COTV", "قانون الكاميرات"], ["COM", "بالمركبة بدون سبب"], ["CS", "عدم استخدام الجليتش"], ["CP", "قانون سرقة المحلات التجارية"], ["Corruption", "قانون الفساد"], ["PO", "فعل أشياء خارقة للطبيعة"], ["PK", "فقدان الذاكرة بعد الموت"], ["PD", "السرقة من الممتلكات"], ["PI", "قانون تفتيش الممتلكات والممتلكات"]]], ["قوانين إضافية", [["AK", "قانون الهدوء"], ["APZ", "ملامسة الشخص داخل السيرفر"], ["PS", "شخص بدون سبب"], ["RTR", "الجري بدون RP"], ["RPO", "استخدام الـRP في غير موضعه"], ["RPARPK", "قانون الحظر مع استخدام الرمز"], ["DM", "القتل بدون سبب"], ["DF", "قتل الشخص أمامك بدون سبب"], ["D08", "فعل شيء بدون سبب"], ["DFA", "استخدام مغدرات بدون RP"], ["DRP", "قانون المداهمة"], ["Exploitng", "استخدام جليتشات Exploiting"], ["FRP", "مثل اللعب على الشخصية بغير الدور الخاص"], ["GR", "عدم التقيد داخل الرول"], ["GRR", "إجبار اللاعب على الخروج من الرول"], ["KO", "الحقد داخل الرول أو خارجه"], ["Inactivity", "قانون عدم النشاط"], ["LTA", "الهروب من الـRP"], ["LK", "قتل داخل المدينة"], ["LOW-RP", "أربي ضعيف"], ["LOHA", "الحب على أدمين"], ["LIRL", "مخالفة داخل الـRP بدون سبب واضح"], ["MIO", "التحرش بين اللاعبين"], ["MIO", "طيارة بدون سبب"], ["MO", "التخطيط بدون مقصد على العموم"], ["MA", "تعدد الحسابات"]]], ["قوانين الشرطة / السيناريوهات", [["NO", "السرقة بدون مرتبة"], ["NJ", "السرقة والقفز في المركبات المتحركة"], ["NK", "قتل لاعب داخل اللعبة"], ["NON-RP", "فعل أشياء بدون RP"], ["NL", "نسيان مهمة"], ["NOTWIRE", "أي كود عند تشغيله"], ["NLR", "لا تنسى الشخصية في حالة NLR"], ["SA", "نشر سيرفرات أخرى"], ["SK", "قتل الأشخاص في الريسباون"], ["SC", "استخدام اسم شخصية مشهورة"], ["SL", "فعل مهمة"], ["SP", "سرقة غير واقعية"], ["SB", "قانون السلاح من أجل الضغط على الشرطة"], ["TK", "قتل أصحابك بالسلاح"], ["UH", "فعل العادات المقررة بالمحة"], ["VDM", "قتل شخص بدون سبب باستخدام مركبة"], ["VR", "سرقة السيارة بدون تشغيل المحرك"], ["VT", "سرقة السيارة وتشغيل المحرك"], ["WH", "التخريب وقت الحركات باستخدام دراجة"], ["O3", "مدخل السلاح في اليد بدون RP"], ["IC", "كلام الواقعية داخل RP"], ["OOC", "كلام خارج الـRP"]]], ["أوامر", [["/goto", "أمر منح صلاحية الـgoto"], ["/duty", "أمر فتح الـduty"], ["/set", "أمر عمل الحالة"], ["/takeweapon", "أمر عمل أخذ السلاح"], ["/bind", "أمر تحديد البنود"]]]];
const app = document.getElementById('app');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const toast = document.getElementById('toast');

function render(filter=''){
  const q = filter.trim().toLowerCase();
  let total=0;
  app.innerHTML='';
  DATA.forEach(([section, items])=>{
    const filtered = items.filter(([code, rule]) => 
      (code+' '+rule).toLowerCase().includes(q)
    );
    if(!filtered.length) return;
    total += filtered.length;
    const sec = document.createElement('section');
    sec.className='section';
    sec.innerHTML = `<h2 class="section-title">${section}</h2><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    filtered.forEach(([code, rule])=>{
      const card = document.createElement('article');
      card.className='card';
      card.innerHTML = `<div class="code">${code}</div>
                        <div class="rule">${rule}</div>
                        <div class="hint">اضغط لنسخ النص</div>`;
      card.addEventListener('click', async ()=>{
        try {
          await navigator.clipboard.writeText(rule);
        } catch(e) {
          const ta=document.createElement('textarea'); ta.value=rule; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); ta.remove();
        }
        toast.textContent = `تم نسخ: ${
          rule.length > 42 ? rule.slice(0,42)+'…' : rule
        } ✅`;
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'), 1600);
      });
      grid.appendChild(card);
    });
    app.appendChild(sec);
  });
  count.textContent = `${total} قانون`;
  empty.style.display = total ? 'none' : 'block';
}
search.addEventListener('input', e => render(e.target.value));
render();
</script>
</body>
</html>
